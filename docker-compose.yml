# Rescope Surveys — full stack (Postgres + API + web UI).
#
# Partner / fast start (pull pre-built images from Docker Hub):
#   docker compose pull
#   docker compose up -d
#   open http://localhost:8080
#
# Developer (rebuild locally):
#   docker compose up --build -d
#
# Developer (live reload — no rebuild):
#   npm run dev:docker
#   open http://localhost:5173
#
# Publish images to Docker Hub (after `docker login`):
#   ./scripts/publish-docker.sh
#
# Database only (local npm dev with `npm run dev:all`):
#   npm run db:up
#   # or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescopesurveys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rescopesurveys}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port is only needed for local npm dev (`docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres -d`).
    # Full stack / partner pull does not expose Postgres on the host.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rescopesurveys -d rescopesurveys']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_USER:-vitomirov}/rescopesurveys-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rescopesurveys}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rescopesurveys}
      PORT: 3003
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value (32+ characters)}
      JWT_EXPIRES_IN: '24h'
      ACCESS_TOKEN_EXPIRES_IN: '15m'
      REFRESH_TOKEN_EXPIRES_IN: '30d'
      COOKIE_SECURE: 'true'
      AUTH_ALLOW_BEARER: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-https://rescopesurveys.com,https://www.rescopesurveys.com,https://surveys.rescopesurveys.com}
      SEED_DEFAULT_ACCOUNTS: 'false'
      RUN_PLATFORM_LIST_MIGRATION: 'false'
    expose:
      - '3003'

  web:
    image: ${DOCKERHUB_USER:-vitomirov}/rescopesurveys-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_API: 'true'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-8080}:80'

volumes:
  pgdata:
