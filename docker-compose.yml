# SurveyForge — full stack (Postgres + API + web UI).
#
# Partner / fast start (pull pre-built images from Docker Hub):
#   docker compose pull
#   docker compose up -d
#   open http://localhost:8080
#
# Developer (rebuild locally):
#   docker compose up --build -d
#
# Developer (live reload — no rebuild):
#   npm run dev:docker
#   open http://localhost:5173
#
# Publish images to Docker Hub (after `docker login`):
#   ./scripts/publish-docker.sh
#
# Database only (local npm dev with `npm run dev:all`):
#   docker compose up postgres -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: surveyforge
      POSTGRES_PASSWORD: surveyforge
      POSTGRES_DB: surveyforge
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U surveyforge -d surveyforge']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_USER:-vitomirov}/surveyforge-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://surveyforge:surveyforge@postgres:5432/surveyforge
      PORT: 3003
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    expose:
      - '3003'

  web:
    image: ${DOCKERHUB_USER:-vitomirov}/surveyforge-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_API: 'true'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-8080}:80'

volumes:
  pgdata:
