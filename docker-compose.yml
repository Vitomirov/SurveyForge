# SurveyForge — full stack (Postgres + API + web UI).
#
# Quick start:
#   docker compose up --build -d
#   open http://localhost:8080
#
# Database only (local npm dev with `npm run dev:all`):
#   docker compose up postgres -d
#
# If `docker compose ps` is empty after `up -d`, check Docker context:
#   docker context ls && docker context use default

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: surveyforge
      POSTGRES_PASSWORD: surveyforge
      POSTGRES_DB: surveyforge
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U surveyforge -d surveyforge']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://surveyforge:surveyforge@postgres:5432/surveyforge
      PORT: 3003
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    expose:
      - '3003'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_API: 'true'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-8080}:80'

volumes:
  pgdata:
